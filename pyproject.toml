[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep pytest's temp dir inside the workspace — the sandboxed environment denies
# writes to the system Temp directory (where pytest's tmp_path fixture lives by default).
addopts = "-q --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["src"]
omit = ["src/app.py"]
